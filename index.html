<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI Chatbot</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: white; 
            padding: 100px 20px; 
        }
        h1 { color: #00d2ff; font-size: 3.5rem; margin-bottom: 10px; }
        p { color: #aaa; font-size: 1.3rem; }
    </style>
</head>
<body>

    <h1>Welcome to Nova AI</h1>
    <p>Your permanent, 24/7 web-searching assistant. Ask anything!</p>

    <!-- NOVA CHATBOT CONTEXT INTERFACE -->
    <script src="https://botpress.cloud"></script>
    <script>
      window.botpress.init({
        "botId": "8df92cb4-3096-427d-9f46-97468af345c1",
        "configuration": {
          "themeMode": "dark"
        }
      });
    </script>

</body>
</html>
